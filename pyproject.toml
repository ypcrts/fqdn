[build-system]
requires = ["setuptools>=77", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "fqdn"
dynamic = ["version"]
description = "Validates fully-qualified domain names against RFC 1123, so that they are acceptable to modern browsers"
readme = "README.md"
license = "MPL-2.0"
license-files = ["LICENSE"]
authors = [{ name = "ypcrts", email = "ypcrts@users.noreply.github.com" }]
keywords = ["fqdn", "domain", "hostname", "RFC3686", "dns"]
requires-python = ">=2.7, !=3.0.*, !=3.1.*, !=3.2.*, !=3.3.*, !=3.4.*, <4"
dependencies = ["cached-property>=1.3.0; python_version < '3.8'"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 2.7",
    "Programming Language :: Python :: 3.5",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Internet :: Name Service (DNS)",
    "Topic :: Internet",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/ypcrts/fqdn"
Repository = "https://github.com/ypcrts/fqdn"
Issues = "https://github.com/ypcrts/fqdn/issues"
Changelog = "https://github.com/ypcrts/fqdn/blob/develop/CHANGELOG.md"

[project.optional-dependencies]
docs = [
    "myst-parser>=3.0; python_version >= '3.9'",
    "sphinx>=7.2; python_version >= '3.9'",
]

[dependency-groups]
dev = [
    "build>=1.2",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.16",
    "twine>=5.1",
    "zizmor>=1.30",
]

[tool.uv]
# The library metadata advertises a Python 2.7+ range, but the development
# toolchain (pytest, mypy, ruff and friends) only exists for modern
# interpreters. The lockfile is therefore resolved for Python 3.10 and newer;
# older interpreters get their coverage from the pip-based compatibility job.
environments = ["python_full_version >= '3.10'"]

[tool.setuptools.packages.find]
include = ["fqdn*"]

[tool.setuptools.package-data]
fqdn = ["py.typed"]

[tool.setuptools_scm]
fallback_version = "0.0.1"
local_scheme = "no-local-version"

[tool.ruff]
# The package keeps a Python 2.7-compatible source tree, so the pyupgrade
# (UP) rules are deliberately left out of the selection below; they would
# rewrite the source into syntax older interpreters cannot parse.
target-version = "py37"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests exercise properties and cached values for their side effects.
"tests/*" = ["B018"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["docs/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["fqdn"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
show_missing = true
